name: Build portable executables

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            binary: eshop.exe
          - os: ubuntu-latest
            name: linux-x64
            binary: eshop
          - os: macos-latest
            name: macos-arm64
            binary: eshop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single-file executable
        run: pyinstaller --onefile --name eshop --console --clean eshop.py

      - name: Smoke test
        shell: bash
        run: |
          ./dist/${{ matrix.binary }} --version
          ./dist/${{ matrix.binary }} countries | head -5

      - name: Package
        shell: bash
        run: |
          mkdir -p package
          cp dist/${{ matrix.binary }} package/
          cp README.md package/
          cd package
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../eshop-${{ matrix.name }}.zip *
          else
            zip -r ../eshop-${{ matrix.name }}.zip *
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: eshop-${{ matrix.name }}
          path: eshop-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
